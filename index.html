<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zephyrOS — Zephyr Z1</title>
  <style>
    :root {
      --bg-light: #fbfbfd;
      --bg-gray: #f5f5f7;
      --bg-dark: #000000;
      --text-dark: #1d1d1f;
      --text-muted: #6e6e73;
      --text-light: #f5f5f7;
      --accent-blue: #0071e3;
      --accent-blue-hover: #0077ed;
      --nav-bg: rgba(251, 251, 253, 0.82);
      --border-light: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-dark);
      background-color: var(--bg-light);
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Navigation */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      height: 44px;
      background: var(--nav-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border-light);
      z-index: 1000;
    }

    .nav-container {
      max-width: 1024px;
      height: 100%;
      margin: 0 auto;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: -0.01em;
    }

    .brand-logo {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0071e3, #30d158);
      display: inline-block;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
      color: rgba(29, 29, 31, 0.8);
    }

    .nav-links a:hover {
      color: #000000;
    }

    .nav-cta {
      background: var(--accent-blue);
      color: #fff;
      padding: 4px 11px;
      border-radius: 980px;
      font-size: 11px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .nav-cta:hover {
      background: var(--accent-blue-hover);
    }

    /* Promo Ribbon */
    .ribbon {
      margin-top: 44px;
      background: var(--bg-gray);
      text-align: center;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-dark);
    }

    .ribbon a {
      color: var(--accent-blue);
    }

    .ribbon a:hover {
      text-decoration: underline;
    }

    /* Buttons */
    .cta-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: #ffffff;
      padding: 11px 22px;
      border-radius: 980px;
      font-size: 17px;
      font-weight: 400;
      transition: background 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--accent-blue-hover);
    }

    .btn-secondary {
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      padding: 10px 21px;
      border-radius: 980px;
      font-size: 17px;
      font-weight: 400;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--accent-blue);
      color: #ffffff;
    }

    .btn-secondary.dark-mode {
      border-color: #2997ff;
      color: #2997ff;
    }

    .btn-secondary.dark-mode:hover {
      background: #2997ff;
      color: #ffffff;
    }

    /* Hero 1: Zephyr Z1 Pro (Dark) */
    .hero-dark {
      background: radial-gradient(circle at 50% 65%, #1d2432 0%, #000000 70%);
      color: var(--text-light);
      text-align: center;
      padding: 72px 20px 0;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .hero-eyebrow {
      font-size: 17px;
      font-weight: 600;
      color: #f56300;
      margin-bottom: 6px;
    }

    .hero-title {
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.06;
    }

    .hero-subtitle {
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-top: 8px;
      color: #d2d2d7;
    }

    .hero-price {
      font-size: 15px;
      color: #86868b;
      margin-top: 12px;
    }

    /* Device Hardware Mockup */
    .device-stage {
      margin: 48px auto 0;
      max-width: 720px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .zephyr-z1-pro-hardware {
      width: 300px;
      height: 440px;
      background: linear-gradient(145deg, #2c313a, #121418);
      border-radius: 48px 48px 0 0;
      border: 4px solid #525866;
      border-bottom: none;
      padding: 14px 14px 0;
      box-shadow: 0 -20px 80px rgba(0, 113, 227, 0.28);
      position: relative;
    }

    .zephyr-screen {
      width: 100%;
      height: 100%;
      border-radius: 36px 36px 0 0;
      background: linear-gradient(160deg, #091e3a 0%, #164b78 45%, #0071e3 80%, #48cae4 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 18px;
    }

    .dynamic-pill {
      width: 96px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
    }

    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, #1e3a8a, #000);
    }

    .os-clock {
      font-size: 56px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .os-badge {
      margin-top: 14px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      font-size: 12px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.02em;
    }

    /* Hero 2: Zephyr Z1 Standard (Light) */
    .hero-light {
      background: var(--bg-gray);
      color: var(--text-dark);
      text-align: center;
      padding: 72px 20px 0;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .hero-light .hero-subtitle {
      color: var(--text-dark);
    }

    .zephyr-z1-lineup {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 48px;
      align-items: flex-end;
    }

    .z1-unit {
      width: 150px;
      height: 280px;
      border-radius: 32px 32px 0 0;
      border: 3px solid rgba(0, 0, 0, 0.15);
      border-bottom: none;
      padding: 10px 10px 0;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }

    .z1-unit:hover {
      transform: translateY(-8px);
    }

    .z1-unit.sky {
      background: linear-gradient(180deg, #b8dcff, #7ab8f5);
    }

    .z1-unit.mint {
      background: linear-gradient(180deg, #bcebd7, #7ad3b0);
      height: 310px;
    }

    .z1-unit.coral {
      background: linear-gradient(180deg, #ffd1c7, #f59c89);
    }

    .z1-inner {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
    }

    .z1-pill {
      width: 48px;
      height: 14px;
      background: #1d1d1f;
      border-radius: 10px;
    }

    /* Hero 3: zephyrOS 26 */
    .hero-os {
      background: linear-gradient(180deg, #eef6ff 0%, #ffffff 100%);
      text-align: center;
      padding: 80px 20px;
      margin-bottom: 12px;
    }

    .os-icon-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px auto 0;
      flex-wrap: wrap;
      max-width: 600px;
    }

    .app-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
    }

    /* 2-Column Promo Grid */
    .promo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 12px 12px;
    }

    .promo-card {
      background: var(--bg-gray);
      min-height: 500px;
      padding: 56px 24px 36px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    .promo-card.dark {
      background: #0b0d12;
      color: var(--text-light);
    }

    .promo-card h3 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .promo-card p {
      font-size: 19px;
      margin-top: 6px;
      max-width: 380px;
      color: var(--text-muted);
    }

    .promo-card.dark p {
      color: #a1a1a6;
    }

    .chip-graphic {
      width: 150px;
      height: 150px;
      border-radius: 28px;
      background: linear-gradient(135deg, #1f242d, #0a0c10);
      border: 2px solid #3a4150;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(41, 151, 255, 0.25);
      margin-top: 24px;
    }

    .chip-graphic span {
      font-size: 12px;
      letter-spacing: 0.14em;
      color: #86868b;
    }

    .chip-graphic strong {
      font-size: 32px;
      background: linear-gradient(90deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .camera-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
