<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>zephyrOS — Zephyr Z 1, Zephyrbook Pro, Zephyrwatch &amp; Zephyr Pad</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
      overflow-x: hidden;
      width: 100%;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Sticky Frosted Navigation Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 44px;
      background: rgba(22, 22, 23, 0.88);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    nav {
      max-width: 1024px;
      height: 100%;
      margin: 0 auto;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
    }

    .nav-logo {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .bag-btn {
      color: #ffffff;
      font-size: 14px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .bag-badge {
      background: #0071e3;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    .menu-toggle {
      display: none;
      color: #ffffff;
      font-size: 20px;
      line-height: 1;
    }

    /* Mobile Dropdown Drawer */
    .mobile-drawer {
      display: none;
      position: fixed;
      top: 44px;
      left: 0;
      width: 100%;
      background: #161617;
      padding: 16px 24px 28px;
      z-index: 999;
      border-bottom: 1px solid #2c2c2e;
      flex-direction: column;
      gap: 14px;
    }

    .mobile-drawer.open {
      display: flex;
    }

    .mobile-drawer a {
      color: #f5f5f7;
      font-size: 17px;
      font-weight: 500;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Promo Ribbon */
    .promo-ribbon {
      margin-top: 44px;
      background-color: #1d1d1f;
      color: #f5f5f7;
      text-align: center;
      padding: 12px 16px;
      font-size: 13px;
    }

    .promo-ribbon button {
      color: #2997ff;
      font-size: 13px;
    }

    .promo-ribbon button:hover {
      text-decoration: underline;
    }

    /* Hero Sections */
    .hero-dark {
      background-color: #000000;
      color: #f5f5f7;
      text-align: center;
      padding: 56px 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .hero-eyebrow {
      color: #f56300;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .hero-title {
      font-size: clamp(34px, 7vw, 56px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.08;
    }

    .hero-subtitle {
      font-size: clamp(18px, 3.5vw, 26px);
      font-weight: 400;
      color: #d2d2d7;
      margin-top: 8px;
      max-width: 600px;
    }

    .cta-group {
      margin-top: 22px;
      display: flex;
      gap: 14px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background-color: #0071e3;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 980px;
      font-size: 15px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background-color: #0077ed;
    }

    .btn-primary:active,
    .btn-secondary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      border: 1px solid #2997ff;
      color: #2997ff;
      padding: 9px 21px;
      border-radius: 980px;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: #2997ff;
      color: #ffffff;
    }

    /* Hardware Mockup - Zephyr Z 1 Pro */
    .device-showcase {
      margin-top: 42px;
      position: relative;
      width: min(280px, 78vw);
      height: 400px;
      border-top-left-radius: 44px;
      border-top-right-radius: 44px;
      background: linear-gradient(145deg, #2c2c2e, #121214);
      padding: 12px 12px 0;
      box-shadow: 0 -10px 60px rgba(41, 151, 255, 0.25);
      border: 2px solid #48484a;
      border-bottom: none;
    }

    .device-screen {
      width: 100%;
      height: 100%;
      border-top-left-radius: 34px;
      border-top-right-radius: 34px;
      background: radial-gradient(circle at 50% 30%, #1c3b70 0%, #091224 60%, #000000 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      overflow: hidden;
    }

    .dynamic-island {
      width: 86px;
      height: 22px;
      background-color: #000000;
      border-radius: 20px;
      margin-bottom: 32px;
    }

    .os-badge {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 6px;
    }

    .os-lock-time {
      font-size: 58px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: rgba(255, 255, 255, 0.95);
      line-height: 1;
    }

    .glow-orb {
      position: absolute;
      bottom: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: conic-gradient(from 90deg, #0071e3, #5e5ce6, #bf5af2, #0071e3);
      filter: blur(26px);
      opacity: 0.85;
    }

    /* Light Hero - Zephyr Z 1 */
    .hero-light {
      background-color: #f5f5f7;
      color: #1d1d1f;
      text-align: center;
      padding: 64px 16px;
      margin-top: 12px;
    }

    .hero-light .hero-subtitle {
      color: #515154;
    }

    .hero-light .btn-secondary {
      border-color: #0071e3;
      color: #0071e3;
    }

    .hero-light .btn-secondary:hover {
      background-color: #0071e3;
      color: #ffffff;
    }

    .color-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.28);
    }

    /* Bento Grid Section */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
      background-color: #ffffff;
    }

    .bento-card {
      min-height: 470px;
      padding: 44px 20px 36px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .card-dark {
      background-color: #000000;
      color: #f5f5f7;
    }

    .card-light {
      background-color: #f5f5f7;
      color: #1d1d1f;
    }

    .card-eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #f56300;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      font-size: 17px;
      margin-top: 8px;
      max-width: 360px;
      opacity: 0.88;
    }

    .card-links {
      margin-top: 16px;
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 16px;
      color: #2997ff;
    }

    .card-light .card-links {
      color: #0066cc;
    }

    .card-links button {
      font-size: 16px;
      color: inherit;
    }

    .card-links button:hover {
      text-decoration: underline;
    }

    /* CSS Product Illustrations */
    .laptop-graphic {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .laptop-lid {
      width: 220px;
      height: 136px;
      background: linear-gradient(135deg, #1c3b70, #0b132b, #3a0ca3);
      border: 4px solid #3a3a3c;
      border-radius: 12px 12px 2px 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 12px 30px rgba(0, 113, 227, 0.3);
    }

    .laptop-base {
      width: 256px;
      height: 10px;
      background: linear-gradient(90deg, #636366, #aeaeb2, #636366);
      border-radius: 0 0 8px 8px;
    }

    .watch-graphic {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .watch-band {
      width: 58px;
      height: 34px;
      background: #2c2c2e;
    }

    .watch-band.top {
      border-radius: 12px 12px 0 0;
    }

    .watch-band.bottom {
      border-radius: 0 0 12px 12px;
    }

    .watch-case {
      width: 104px;
      height: 122px;
      background: #000000;
      border: 4px solid #8e8e93;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
