<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>zephyrOS — Zephyr Z 1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Navigation Bar */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 44px;
      background: rgba(22, 22, 23, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    nav {
      max-width: 1024px;
      height: 100%;
      margin: 0 auto;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.82);
    }

    .nav-logo {
      font-weight: 600;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    /* Promo Ribbon */
    .promo-ribbon {
      margin-top: 44px;
      background-color: #1d1d1f;
      color: #f5f5f7;
      text-align: center;
      padding: 12px 16px;
      font-size: 13px;
    }

    .promo-ribbon a {
      color: #2997ff;
    }

    .promo-ribbon a:hover {
      text-decoration: underline;
    }

    /* Hero Section - Zephyr Z 1 Pro */
    .hero-dark {
      background-color: #000000;
      color: #f5f5f7;
      text-align: center;
      padding: 64px 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .hero-eyebrow {
      color: #f56300;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .hero-title {
      font-size: clamp(40px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.07;
    }

    .hero-subtitle {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 400;
      color: #f5f5f7;
      margin-top: 6px;
      letter-spacing: -0.01em;
    }

    .cta-group {
      margin-top: 22px;
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }

    .btn-primary {
      background-color: #0071e3;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 980px;
      font-size: 15px;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #0077ed;
    }

    .btn-secondary {
      border: 1px solid #2997ff;
      color: #2997ff;
      padding: 9px 21px;
      border-radius: 980px;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: #2997ff;
      color: #ffffff;
    }

    /* Hardware Mockup - Zephyr Z 1 */
    .device-showcase {
      margin-top: 48px;
      position: relative;
      width: 290px;
      height: 440px;
      border-top-left-radius: 46px;
      border-top-right-radius: 46px;
      background: linear-gradient(145deg, #2c2c2e, #121214);
      padding: 12px 12px 0;
      box-shadow: 0 -10px 60px rgba(41, 151, 255, 0.25);
      border: 2px solid #48484a;
      border-bottom: none;
    }

    .device-screen {
      width: 100%;
      height: 100%;
      border-top-left-radius: 36px;
      border-top-right-radius: 36px;
      background: radial-gradient(circle at 50% 30%, #1c3b70 0%, #091224 60%, #000000 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
      overflow: hidden;
    }

    .dynamic-island {
      width: 92px;
      height: 24px;
      background-color: #000000;
      border-radius: 20px;
      margin-bottom: 36px;
    }

    .os-badge {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
    }

    .os-lock-time {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: rgba(255, 255, 255, 0.94);
      line-height: 1;
    }

    .glow-orb {
      position: absolute;
      bottom: -40px;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: conic-gradient(from 90deg, #0071e3, #5e5ce6, #bf5af2, #0071e3);
      filter: blur(28px);
      opacity: 0.85;
    }

    /* Secondary Hero - Zephyr Z 1 Standard */
    .hero-light {
      background-color: #f5f5f7;
      color: #1d1d1f;
      text-align: center;
      padding: 72px 20px 64px;
      margin-top: 12px;
    }

    .hero-light .hero-subtitle {
      color: #1d1d1f;
    }

    .hero-light .btn-secondary {
      border-color: #0071e3;
      color: #0071e3;
    }

    .hero-light .btn-secondary:hover {
      background-color: #0071e3;
      color: #ffffff;
    }

    .color-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    /* Bento Grid Section */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
      background-color: #ffffff;
    }

    .bento-card {
      min-height: 480px;
      padding: 48px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .card-dark {
      background-color: #000000;
      color: #f5f5f7;
    }

    .card-light {
      background-color: #f5f5f7;
      color: #1d1d1f;
    }

    .card-title {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      font-size: 19px;
      margin-top: 8px;
      max-width: 380px;
    }

    .card-links {
      margin-top: 16px;
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 17px;
      color: #2997ff;
    }

    .card-light .card-links {
      color: #0066cc;
    }

    .card-links a:hover {
      text-decoration: underline;
    }

    .chip-graphic {
      width: 156px;
      height: 156px;
      border-radius: 32px;
      background: linear-gradient(135deg, #2c2c2e, #0a0a0c);
      border: 1px solid #48484a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0, 113, 227, 0.3);
      margin-top: 24px;
    }

    .chip-graphic span {
      font-size: 13px;
      color: #86868b;
      letter-spacing: 0.1em;
    }

    .chip-graphic strong {
      font-size: 32px;
      color: #64d2ff;
    }

    .os-wave-graphic {
      width: 250px;
      height: 150px;
      border-radius: 24px;
      background: linear-gradient(135deg, #0071e3, #5ac8fa);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 24px;
      box-shadow: 0 18px 40px rgba(0, 113, 227, 0.25);
    }

    /* Footer */
    footer {
      background-color: #f5f5f7;
      color: #86868b;
      font-size: 12px;
      padding: 40px 22px;
      border-top: 1px solid #d2d2d7;
    }

    .footer-container {
      max-width: 980px;
      margin: 0 auto;
    }

    .footer-notes {
      padding-bottom: 20px;
      border-bottom: 1px solid #d2d2d7;
      line-height: 1.6;
    }

    .footer-columns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 24px 0;
    }

    .footer-col h4 {
      color: #1d1d1f;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .footer-col ul {
      list-style: none;
    }

    .footer-col li {
      margin-bottom: 8px;
    }

    .footer-col a:hover {
      text-decoration: underline;
    }

    .footer-bottom {
      padding-top: 16px;
      border-top: 1px solid #d2d2d7;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
      .bento-grid {
        grid-template-columns: 1fr;
      }
      .footer-columns {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#" class="nav-logo">zephyrOS</a>
      <ul class="nav-links">
        <li><a href="#z1pro">Zephyr Z 1 Pro</a></li>
        <li><a href="#z1">Zephyr Z 1</a></li>
        <li><a href="#zephyros">zephyrOS 18</a></li>
        <li><a href="#silicon">Z1 Core</a></li>
        <li><a href="#tradein">Trade In</a></li>
      </ul>
      <div>
        <a href="#z1" style="color:#ffffff;font-weight:500;">Buy</a>
      </div>
    </nav>
  </header>

  <div class="promo-ribbon">
    Get $180–$650 in credit toward a new <strong>Zephyr Z 1</strong> or <strong>Zephyr Z 1 Pro</strong> when you trade in an eligible device. <a href="#tradein">Shop now &gt;</a>
  </div>

  <section id="z1pro" class="hero-dark">
    <span class="hero-eyebrow">NEW</span>
    <h1 class="hero-title">Zephyr Z 1 Pro</h1>
    <p class="hero-subtitle">Aerospace Titanium. Built for zephyrOS Intelligence.</p>
    <div class="cta-group">
      <a href="#silicon" class="btn-primary">Learn more</a>
      <a href="#z1" class="btn-secondary">Buy</a>
