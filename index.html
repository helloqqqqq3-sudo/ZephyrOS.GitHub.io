<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>zephyrOS — Zephyr Z 1, Zephyrbook Pro, Zephyrwatch &amp; Zephyr Pad</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0, 113, 227, 0.2);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #1d1d1f;
      line-height: 1.4;
      overflow-x: hidden;
    }

    button, a {
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      text-decoration: none;
    }

    button {
      border: none;
      background: none;
      position: relative;
      z-index: 5;
    }

    /* Header & Mobile Nav */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 44px;
      background: rgba(22, 22, 23, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1000;
    }

    nav {
      max-width: 1024px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #e5e5ea;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 15px;
      color: #ffffff;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      list-style: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bag-btn {
      color: #ffffff;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 8px;
    }

    .bag-badge {
      background: #0071e3;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
    }

    .menu-btn {
      display: none;
      color: #ffffff;
      font-size: 22px;
      padding: 4px 8px;
    }

    .drawer {
      display: none;
      position: fixed;
      top: 44px;
      left: 0;
      width: 100%;
      background: #161617;
      padding: 16px 22px 24px;
      z-index: 999;
      flex-direction: column;
      gap: 14px;
    }

    .drawer.open {
      display: flex;
    }

    .drawer a {
      color: #f5f5f7;
      font-size: 17px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2c2c2e;
    }

    /* Promo & Heroes */
    .promo {
      margin-top: 44px;
      background: #1d1d1f;
      color: #f5f5f7;
      text-align: center;
      padding: 11px 14px;
      font-size: 13px;
    }

    .promo button {
      color: #2997ff;
      font-size: 13px;
      font-weight: 500;
    }

    .hero-dark {
      background: #000000;
      color: #f5f5f7;
      text-align: center;
      padding: 52px 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-light {
      background: #f5f5f7;
      color: #1d1d1f;
      text-align: center;
      padding: 56px 16px;
      margin-top: 12px;
    }

    .eyebrow {
      color: #f56300;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .title {
      font-size: clamp(34px, 7vw, 54px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.08;
    }

    .sub {
      font-size: clamp(17px, 3.5vw, 24px);
      margin-top: 6px;
      opacity: 0.88;
      max-width: 560px;
    }

    .cta {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 10;
    }

    .btn-blue {
      background: #0071e3;
      color: #ffffff;
      padding: 11px 24px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
    }

    .btn-outline {
      border: 1px solid #2997ff;
      color: #2997ff;
      padding: 10px 23px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
    }

    .hero-light .btn-outline {
      border-color: #0071e3;
      color: #0071e3;
    }

    /* Phone Mockup */
    .phone {
      margin-top: 38px;
      width: min(265px, 76vw);
      height: 370px;
      border-radius: 42px 42px 0 0;
      background: #1c1c1e;
      padding: 11px 11px 0;
      border: 2px solid #48484a;
      border-bottom: none;
      box-shadow: 0 -10px 50px rgba(41, 151, 255, 0.25);
      pointer-events: none;
    }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 32px 32px 0 0;
      background: radial-gradient(circle at 50% 30%, #1c3b70 0%, #091224 65%, #000000 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      overflow: hidden;
    }

    .island {
      width: 82px;
      height: 20px;
      background: #000000;
      border-radius: 20px;
      margin-bottom: 28px;
    }

    .clock {
      font-size: 54px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
    }

    .orb {
      position: absolute;
      bottom: -40px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: conic-gradient(#0071e3, #5e5ce6, #bf5af2, #0071e3);
      filter: blur(24px);
      opacity: 0.85;
    }

    /* Bento Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .card {
      min-height: 430px;
      padding: 40px 18px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .dark {
      background: #000000;
      color: #f5f5f7;
    }

    .light {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .card-title {
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 700;
    }

    .card-sub {
      font-size: 16px;
      margin-top: 6px;
      opacity: 0.85;
      max-width: 340px;
    }

    .links {
      margin-top: 14px;
      display: flex;
      gap: 18px;
      justify-content: center;
      font-size: 16px;
      color: #2997ff;
    }

    .light .links {
      color: #0066cc;
    }

    .links button {
      font-size: 16px;
      color: inherit;
      padding: 6px 10px;
    }

    /* Device Art */
    .mac-lid {
      width: 200px;
      height: 124px;
      background: linear-gradient(135deg, #1c3b70, #3a0ca3);
      border: 4px solid #3a3a3c;
      border-radius: 10px 10px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
      margin-top: 20px;
    }

    .mac-base {
      width: 236px;
      height: 9px;
      background: #8e8e93;
      border-radius: 0 0 6px 6px;
    }

    .watch-body {
      width: 96px;
      height: 112px;
      background: #000000;
      border: 4px solid #8e8e93;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .watch-ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 5px solid #ff375f;
      border-top-color: #30d158;
      border-right-color: #0a84ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
    }

    .pad-body {
      width: 184px;
      height: 132px;
      background: linear-gradient(135deg, #0071e3, #5ac8fa, #bf5af2);
      border: 5px solid #1d1d1f;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 700;
      margin-top: 20px;
    }

    .os-box {
      width: 200px;
      height: 124px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0071e3, #5ac8fa);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 700;
      margin-top: 20px;
    }

    /* Apple-Style Buy & Bag Modal */
    .backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 5000;
      align-items: flex-end;
      justify-content: center;
    }

    .backdrop.open {
      display: flex;
    }

    .sheet {
      background: #ffffff;
      color: #1d1d1f;
      width: 100%;
      max-width: 740px;
      max-height: 88vh;
      overflow-y: auto;
      border-radius: 22px 22px 0 0;
      padding: 22px 18px 36px;
    }

    @media (min-width: 769px) {
      .backdrop {
        align-items: center;
        padding: 20px;
      }
      .sheet {
        border-radius: 22px;
        padding: 30px;
      }
    }

    .close-btn {
      float: right;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #e8e8ed;
      color: #1d1d1f;
      font-size: 20px;
      font-weight: 700;
    }

    .step {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #d2d2d7;
    }

    .step h4 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .step h4 span {
      color: #86868b;
      font-weight: 400;
    }

    .opt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
    }

    .opt {
      border: 1px solid #86868b;
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      color: #1d1d1f;
    }

    .opt.sel {
      border: 2px solid #0071e3;
      background: rgba(0, 113, 227, 0.06);
    }

    .swatches {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .swatch {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
